<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="410" viewBox="0 0 1280 410" role="img" aria-labelledby="title desc">
  <title id="title">长程任务的外部事实恢复路径</title>
  <desc id="desc">上下文变化后，回读交付与执行 Issue 的合同、PR、Review 和 Git 实现证据，确认本轮批准范围及当前任务；Project 仅依据实际事实补展示，合同完整时同步失败不阻塞执行。</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1"><stop stop-color="#0d1728"/><stop offset="1" stop-color="#142b3d"/></linearGradient>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9" fill="none" stroke="#63d6be" stroke-width="2"/></marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; }
      .title { fill: #f2f7fc; font-weight: 700; }
      .body { fill: #b7c9db; font-size: 18px; }
      .line { fill: none; stroke: #63d6be; stroke-width: 2; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1280" height="410" rx="22" fill="url(#background)"/>
  <rect x="1" y="1" width="1278" height="408" rx="21" fill="none" stroke="#30485f"/>
  <rect x="48" y="38" width="5" height="32" rx="2.5" fill="#63d6be"/>
  <text x="70" y="63" class="title" font-size="28">让任务记忆跨越会话边界</text>
  <text x="1232" y="60" text-anchor="end" fill="#7babc9" font-size="18">按本轮交付回读外部事实</text>

  <rect x="48" y="111" width="270" height="223" rx="16" fill="#1c263a" stroke="#586174"/>
  <text x="70" y="149" class="title" font-size="23">会话上下文变化</text>
  <path d="M70 170 H295" stroke="#3c495e"/>
  <text x="70" y="207" class="body">上下文压缩</text>
  <text x="70" y="244" class="body">会话切换</text>
  <text x="70" y="281" class="body">进程重启</text>
  <path d="M328 222 H369" class="line"/>

  <rect x="382" y="111" width="444" height="223" rx="16" fill="#122d39" stroke="#52b6a6"/>
  <text x="404" y="149" class="title" font-size="23">回读任务合同与实现证据</text>
  <path d="M404 170 H804" stroke="#2e5260"/>
  <text x="404" y="198" fill="#7ce0c8" font-size="18" font-weight="600">Issue</text>
  <text x="554" y="198" class="body">交付与执行合同 · 批准范围</text>
  <text x="404" y="235" fill="#7ce0c8" font-size="18" font-weight="600">PR / Review</text>
  <text x="554" y="235" class="body">差异 · 验证 · 正式结论</text>
  <text x="404" y="272" fill="#7ce0c8" font-size="18" font-weight="600">Git</text>
  <text x="554" y="272" class="body">工作树 · 分支 · 准确 SHA</text>
  <text x="404" y="309" fill="#7ce0c8" font-size="18" font-weight="600">Project</text>
  <text x="554" y="309" class="body">已指定看板 · 实际展示状态</text>
  <path d="M837 222 H877" class="line"/>

  <rect x="890" y="111" width="342" height="223" rx="16" fill="#163431" stroke="#589f89"/>
  <text x="913" y="149" class="title" font-size="23">恢复当前任务</text>
  <path d="M913 170 H1209" stroke="#315749"/>
  <text x="913" y="207" class="body">核对批准范围与当前执行任务</text>
  <text x="913" y="244" class="body">保留现场 · 按事实补看板展示</text>
  <text x="913" y="281" class="body">继续已批准工作 · 完成即停</text>
  <text x="640" y="378" text-anchor="middle" fill="#92afc5" font-size="18">合同完整时看板同步失败不阻塞执行；缺口记入现有进度与报告</text>
</svg>
