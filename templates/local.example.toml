# 手动复制到仓库外的本机绑定文件后填写；不要把填写后的副本提交到任何仓库。
# 文件定位及字段语义见治理规范第四节。此文件由代理读取，不是 Codex 原生配置层。
# 只填写非认证元数据，不填写令牌、口令或私钥；路径使用实际绝对路径，不写 ~ 或 $HOME。

[paths]
source_root = "/absolute/path/to/codex-governance"

# 开发组全部角色与平台操作使用同一账号，PR 由实际签发组创建。
[github.development]
login = "YOUR_DEVELOPMENT_LOGIN"
config_dir = "/absolute/path/to/gh-development"

# 可选：每个需要归档的仓库分别添加一组；实际路径只填写在仓库外的私有绑定中。
# git_common_dir 取该仓库 git rev-parse --path-format=absolute --git-common-dir 的实际路径。
# root 必须位于实际挂载的 mount_point 内，且在待清理工作树和构建输出之外。
# [[evidence_archives]]
# git_common_dir = "/absolute/path/to/project/.git"
# root = "/absolute/mounted-backup/projects/project"
# mount_point = "/absolute/mounted-backup"
