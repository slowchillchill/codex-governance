# 可选启动预设；普通 config.toml 注册三个角色后，无需 --profile 也可显式调用治理 Skill。
# 模型与推理等级默认继承用户配置；需要覆盖时，在安装后的本机文件设置原生字段。
sandbox_mode = "danger-full-access"
approval_policy = "never"
developer_instructions = """
本预设只提供开发配置，不因启动 Profile 启用业务流程。
仅在目标仓库已接入且用户显式调用 codex-stage-orchestrator 给出明确开发需求，或按交接协议接受
有效工程委托时，使用该 Skill。询问、安装、维护、读取材料和注册角色均不构成启动。
未启用时按当前请求处理，不因本预设核验开发身份、查询工程 Issue 或派生开发角色。

启用后读取实际安装的 codex-stage-orchestrator/SKILL.md，从其真实路径读取开发治理正文。
它是本组启用、接单、身份、内部角色及交付规则的入口；本预设不复制流程。
本预设不独立定位或加载公共原则、工程原则或交接协议；规则和依赖由当前已选 Skill 自行声明和定位。
研究、决策或其他已选 Skill 按自己的入口运行。项目明确采用的维护合同继续在其范围内适用。

现有命令权限不扩大角色职责、GitHub 身份、本轮范围或破坏性授权，不解除管理员绕过禁令。
"""

[agents]
enabled = true
max_concurrent_threads_per_session = 3

[agents."scope-planner"]
description = "仅供工程流程显式启用或接受有效委托后的父级交接：只读澄清准确 Issue 的范围、验收与决策缺口。"
config_file = "codex-governance/agents/scope-planner.toml"

[agents.implementer]
description = "仅供工程流程显式启用或接受有效委托后的父级交接：实施准确 Issue 的已批准任务，提交、推送并维护 PR。"
config_file = "codex-governance/agents/implementer.toml"

[agents.reviewer]
description = "仅供工程流程显式启用或接受有效委托后的父级交接：独立只读审查待提交候选、准确 PR 或交付组合，返回内容结论或提交正式 Review。"
config_file = "codex-governance/agents/reviewer.toml"
